[project]
name = "djangoblogproject"
version = "0.1.0"
description = ""
authors = [
    {name = "braviss", email = "doctype.developer@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.3,<7.0.0",
    "django-environ>=0.13.0,<0.14.0",
    "pillow>=12.1.1,<13.0.0",
    "transliterate>=1.10.2,<2.0.0",
    "django-modeltranslation>=0.20.2,<0.21.0",
    "django-view-breadcrumbs>=2.5.1,<3.0.0",
    "django-tinymce>=5.0.0,<6.0.0",
    "unidecode>=1.4.0,<2.0.0",
    "psycopg2-binary>=2.9.11,<3.0.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0,<8.0.0",
    "ruff>=0.15.10,<0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]