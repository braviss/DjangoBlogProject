{% load i18n %}

{% if breadcrumbs %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    {% for breadcrumb in breadcrumbs %}
      {% if forloop.last %}
        <li class="breadcrumb-item active" aria-current="page">{{ breadcrumb.1 }}</li>
      {% else %}
        <li class="breadcrumb-item">
          <a href="{{ breadcrumb.0 }}">{{ breadcrumb.1 }}</a>
        </li>
      {% endif %}
    {% endfor %}
  </ol>
</nav>
{% endif %}
